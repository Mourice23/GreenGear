<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | GreenGear Outdoors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">GreenGear</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="inventory.html" aria-current="page">Inventory</a></li>
          <li><a href="weather.html">Weather</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Product inventory</h1>
    <p class="lede">Check what we have in stock. Search by product code or browse the full list.</p>

    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Find a product by code</h2>
      <form id="search-form" novalidate>
        <label for="code-input">Product code</label>
        <div class="row">
          <input id="code-input" name="code" type="text" placeholder="e.g. 101-01" autocomplete="off" maxlength="6">
          <button type="submit">Search</button>
          <button type="button" id="clear-btn" class="secondary" hidden>Clear</button>
        </div>
        <p id="search-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
      <div id="result"></div>
    </section>

    <section aria-labelledby="all-heading">
      <h2 id="all-heading">All products <span id="count" class="count"></span></h2>
      <p id="status" class="msg" role="status">Loading products...</p>
      <table id="product-table" hidden>
        <thead>
          <tr>
            <th scope="col">Code</th>
            <th scope="col">Category</th>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col" class="num">Quantity</th>
            <th scope="col" class="num">Unit price</th>
          </tr>
        </thead>
        <tbody id="product-body"></tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    <p>GreenGear Outdoors. Camping and hiking gear.</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
